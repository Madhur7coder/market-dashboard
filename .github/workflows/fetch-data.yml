name: Fetch Market Data

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas beautifulsoup4

      - name: Run market data fetcher
        run: python fetch_data.py

      - name: Run fixed-income funds fetcher
        run: python fetch_funds.py
        # Don't fail the whole workflow if some funds fail to fetch — fund-source
        # availability is flaky for institutional UCITS, but the main dashboard
        # data should still get committed even if this step has issues.
        continue-on-error: true

      - name: Validate generated JSON
        # Strict gate: reject NaN/Infinity (which json.load accepts but the
        # browser's JSON.parse does not) and any malformed file. If this fails,
        # the workflow stops before committing, so the last-good data stays live
        # instead of a broken file taking down the dashboard.
        run: |
          python - <<'PY'
          import json, sys
          def strict(path):
              try:
                  with open(path) as f:
                      json.load(f, parse_constant=lambda c: (_ for _ in ()).throw(
                          ValueError(f"invalid JSON token {c!r}")))
              except FileNotFoundError:
                  print(f"⚠ {path} not found — skipping"); return
              except Exception as e:
                  sys.exit(f"✗ {path} is not valid JSON: {e}")
              print(f"✓ {path} is valid JSON")
          strict('data/data.json')
          strict('data/funds.json')
          PY

      - name: Commit & push generated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/funds.json
          git diff --staged --quiet || git commit -m "chore: refresh market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
